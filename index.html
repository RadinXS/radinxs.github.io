<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<title>Radin 3D</title>
<style>

#app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}

.sp{flex:1}.pill{color:var(--m);font-size:12px}

.fl{position:absolute;background:var(--p);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--b);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#tools{left:12px;top:12px;padding:8px;display:flex;flex-direction:column;gap:6px;width:96px}
#tools .h{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;margin:6px 2px 0}
#tools button{text-align:left;padding:0 10px}
#dock{left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0));transform:translateX(-50%);padding:6px;display:flex;gap:6px;align-items:center;max-width:calc(100% - 20px);overflow-x:auto}
.v{width:1px;height:22px;background:var(--b);flex:none}
.fe,#ibtn{display:none}[data-mode=face] .fe{display:inline-block!important}
#hint{left:50%;top:12px;transform:translateX(-50%);padding:6px 12px;border-radius:99px;color:var(--m);font-size:12px;pointer-events:none;white-space:nowrap}
#insp{right:12px;top:12px;bottom:12px;width:264px;padding:14px;overflow-y:auto}
#insp h4{font-size:10px;color:var(--m);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
#insp h4:first-child{margin-top:0}
#insp label{display:block;color:var(--m);font-size:11px;margin:6px 0 3px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.row{display:flex;gap:6px}.row>*{flex:1}
#sw{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:8px}
#sw button{height:auto;aspect-ratio:1;padding:0;border-radius:7px}
#col{width:46px;height:32px;flex:none;border:0;background:none;padding:0}
.it{display:block;width:100%;text-align:left;margin-bottom:4px;height:32px}

@media(max-width:760px){

#insp.open{transform:none}#ibtn{display:inline-block}}

#vp{background:radial-gradient(ellipse at 50% 35%,#252a36 0,#171a21 55%,#0e1014 100%)}
.fl{border-color:rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}

#tools{width:152px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.gr b{font-size:19px;font-weight:400;line-height:1}
#views{left:12px;bottom:14px;padding:5px;display:flex;gap:4px}
#views button{height:30px;padding:0 9px;font-size:12px}
.tabs{display:flex;gap:4px;background:#0b0d11;padding:4px;border-radius:11px;margin-bottom:12px}
.tabs button{flex:1;height:30px;border:0;background:none}.tabs .on{background:linear-gradient(135deg,var(--a),var(--a2))}
.tp{display:none}.tp.show{display:block}

#sel{font-weight:600;color:var(--t)!important;background:rgba(255,255,255,.05);padding:8px 10px;border-radius:9px}
.it.on{background:rgba(124,140,255,.25);border-color:var(--a)}
@media(max-width:760px){.gr{display:contents}.gr button{flex:none;width:auto;height:36px;flex-direction:row;padding:0 10px;gap:6px}.pill{display:none}
#views{left:8px;bottom:70px}#tools{width:auto}}

<body data-mode="object"><div id="app">

<button id="undo">↶</button><button id="redo">↷</button><div class="sp"></div>

</div><div class="tp" data-p="l"><h4>Paint</h4>
<div class="row"><input type="color" id="col" value="#7c8cff"><button id="paintBtn">Apply color</button></div>

<div class="row" style="margin-top:8px"><button class="fe" id="delFace" style="display:none">Delete face</button></div><div style="color:var(--m);font-size:11px;margin-top:8px">Face mode: Extrude (E), Inset (I), Delete face (X).</div></div><h4>Objects</h4><div id="list"></div>
</aside></main></div>

const hints={object:'Tap to select · drag the gizmo to transform',face:'Tap a face · Extrude, Inset or Paint it',vertex:'Tap a vertex · drag the arrows to move it'};

for(let i=0;i<col.length;i+=3)c.toArray(col,i);g.computeBoundingBox();

function undo(){if(!undoS.length)return;redoS.push(snap());restore(undoS.pop())}
function redo(){if(!redoS.length)return;undoS.push(snap());restore(redoS.pop())}
function del(){if(!sel)return;saveUndo();const m=sel;select(null);scene.remove(m);m.geometry.dispose();m.material.dispose();objs=objs.filter(o=>o!==m);ui()}
function dup(){if(!sel)return;saveUndo();const a=attrs(sel);select(build({name:sel.userData.type+' '+(++n),type:sel.userData.type,p:a.position.array,n:a.normal.array,c:a.color.array,t:[sel.position.clone().addScalar(.6).toArray(),[sel.rotation.x,sel.rotation.y,sel.rotation.z],sel.scale.toArray()],flat:sel.material.flatShading,r:sel.material.roughness,mt:sel.material.metalness}))}
/* ---------- topology ---------- */
function topo(m){if(m.userData.tp)return m.userData.tp;const P=attrs(m).position.array,T=P.length/9,keys=[],nm=[],em=new Map(),a=new THREE.Vector3(),b=new THREE.Vector3();
for(let i=0;i<P.length/3;i++)keys.push(P[i*3].toFixed(4)+','+P[i*3+1].toFixed(4)+','+P[i*3+2].toFixed(4));

['#ffffff','#c9ced8','#6b7280','#1f2330','#ff5c6c','#ff9a3d','#ffd43d','#4cd964','#2dd4bf','#38bdf8','#7c8cff','#b07cff','#ff6bd6','#a0623a','#f6e58d','#fca5a5'].forEach(c=>{const b=document.createElement('button');b.style.background=c;b.onclick=()=>{$('#col').value=c;paint(c)};$('#sw').appendChild(b)});

if(r==0)sel.position.setComponent(c,v);if(r==1)sel.rotation['xyz'[c]]=THREE.MathUtils.degToRad(v);if(r==2)sel.scale.setComponent(c,v||.01);ui()});
function ui(){document.body.dataset.mode=mode;$('#hint').textContent=hints[mode];
$$('.mb').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));$$('.tm').forEach(b=>b.classList.toggle('on',b.dataset.t===tm));
$('#sel').textContent=sel?`${sel.name}${mode==='face'&&selTris.size?' · face selected':''}${mode==='vertex'&&vIdx.length?' · vertex selected':''}`:'Nothing selected';
const v=sel?[...sel.position.toArray(),...['x','y','z'].map(a=>THREE.MathUtils.radToDeg(sel.rotation[a])),...sel.scale.toArray()]:[];
$$('#xf input').forEach((i,k)=>{if(document.activeElement!==i)i.value=sel?+v[k].toFixed(2):''});
if(sel){$('#rough').value=sel.material.roughness;$('#metal').value=sel.material.metalness}let tv=0,tt=0;objs.forEach(m=>{const c=attrs(m).position.count;tv+=c;tt+=c/3});$('#stats').textContent=`${objs.length} obj · ${tt} tris`;
$('#list').innerHTML='';objs.forEach(m=>{const b=document.createElement('button');b.className='it'+(m===sel?' on':'');b.textContent=icons[m.userData.type]+'  '+m.name;b.onclick=()=>select(m);$('#list').appendChild(b)});autosave()}
$$('.mb').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
Object.keys(makers).forEach(k=>{const b=document.createElement('button');b.innerHTML=`<b>${icons[k]}</b>${k}`;b.onclick=()=>add(k);$('#shapes').appendChild(b)});
$$('.tb').forEach(b=>b.onclick=()=>{$$('.tb').forEach(x=>x.classList.toggle('on',x===b));$$('.tp').forEach(p=>p.classList.toggle('show',p.dataset.p===b.dataset.p))});$('.tp').classList.add('show');
$$('[data-v]').forEach(b=>b.onclick=()=>{const d={p:[4.5,3.5,5.5],f:[0,0,9],r:[9,0,0],t:[0,9,.001]}[b.dataset.v],t=orbit.target;cam.position.set(t.x+d[0],t.y+d[1],t.z+d[2])});
$('#frame').onclick=()=>{orbit.target.copy(sel?sel.position:new THREE.Vector3())};
$('#grid').onclick=e=>{grid.visible=!grid.visible;e.target.classList.toggle('on',grid.visible)};
$('#wire').onclick=e=>{wireAll=!wireAll;e.target.classList.toggle('on',wireAll);objs.forEach(m=>m.material.wireframe=wireAll)};
$('#rough').onpointerdown=$('#metal').onpointerdown=saveUndo;
$('#rough').oninput=e=>{if(sel)sel.material.roughness=+e.target.value};$('#metal').oninput=e=>{if(sel)sel.material.metalness=+e.target.value};
$('#wireObj').onclick=()=>{if(sel)sel.material.wireframe=!sel.material.wireframe};
$('#mirror').onclick=()=>{if(!sel)return;saveUndo();sel.scale.x*=-1;ui()};
$('#delFace').onclick=delFace;
function delFace(){if(mode!=='face'||!selTris.size)return toast('Select a face first');saveUndo();
const f=a=>{const o=[];for(let t=0;t<a.length/9;t++)if(!selTris.has(t))for(let k=0;k<9;k++)o.push(a[t*9+k]);return new Float32Array(o)};
const g=sel.geometry,a=g.attributes,P=f(a.position.array),N=f(a.normal.array),C=f(a.color.array);
if(!P.length)return del();
g.setAttribute('position',new THREE.BufferAttribute(P,3));g.setAttribute('normal',new THREE.BufferAttribute(N,3));g.setAttribute('color',new THREE.BufferAttribute(C,3));
sel.userData.tp=null;g.computeBoundingSphere();g.computeBoundingBox();selTris=new Set();refresh();toast('Face deleted')}
window.claude?.use?.('downloads').then(d=>{DL=d}).catch(()=>{});
async function dl(data,filename){if(!DL)return toast('Downloads unavailable in this view');try{await DL.save({filename,data});toast('Saved '+filename)}catch(e){if(e.code!=='declined')toast('Save failed')}}
const ser=()=>JSON.stringify(snap().o.map(o=>({...o,p:[...o.p],n:[...o.n],c:[...o.c]})));
function load(t){try{const o=JSON.parse(t);restore({i:0,o:o.map(d=>({...d,p:new Float32Array(d.p),n:new Float32Array(d.n),c:new Float32Array(d.c)}))});n=objs.length;return objs.length>0}catch(e){return false}}
let at;function autosave(){clearTimeout(at);at=setTimeout(()=>{try{localStorage.setItem('radin3d',ser())}catch(e){}},800)}
$('#save').onclick=()=>dl(ser(),'project.json');
$('#open').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{saveUndo();toast(load(t)?'Project loaded':'Invalid project file')})};
const setTm=t=>{tm=t;if(mode==='object'&&sel)gizmo.setMode(t);ui()};
$$('.tm').forEach(b=>b.onclick=()=>setTm(b.dataset.t));
let snapOn=false;$('#snap').onclick=e=>{snapOn=!snapOn;e.target.classList.toggle('on',snapOn);gizmo.setTranslationSnap(snapOn?.25:null);gizmo.setRotationSnap(snapOn?Math.PI/12:null);gizmo.setScaleSnap(snapOn?.1:null)};
$('#undo').onclick=undo;$('#redo').onclick=redo;$('#dup').onclick=dup;$('#del').onclick=del;
$('#ext').onclick=()=>editFace('extrude');$('#ins').onclick=()=>editFace('inset');
const shade=f=>{if(!sel)return;saveUndo();sel.material.flatShading=f;sel.material.needsUpdate=true};
$('#smooth').onclick=()=>shade(false);$('#flat').onclick=()=>shade(true);
$('#ibtn').onclick=()=>$('#insp').classList.toggle('open');
$('#exp').onclick=()=>{if(!objs.length)return toast('Nothing to export');const g=new THREE.Group();objs.forEach(m=>g.add(m.clone()));g.updateMatrixWorld(true);dl(new OBJExporter().parse(g),'model.obj.txt')};
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;
if(c&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(c&&k==='d'){e.preventDefault();dup()}
else if(k==='g')setTm('translate');else if(k==='r')setTm('rotate');else if(k==='s')setTm('scale');
else if(k==='1')setMode('object');else if(k==='2')setMode('vertex');else if(k==='3')setMode('face');
else if(k==='e')editFace('extrude');else if(k==='i')editFace('inset');
else if(k==='f'&&sel){orbit.target.copy(sel.position)}else if(k==='x'&&mode==='face')delFace();else if(e.key==='Delete'||e.key==='Backspace')del()});
function resize(){const v=$('#vp');cam.aspect=v.clientWidth/v.clientHeight;cam.updateProjectionMatrix();R.setSize(v.clientWidth,v.clientHeight,false)}
new ResizeObserver(resize).observe($('#vp'));
{let sv=null;try{sv=localStorage.getItem('radin3d')}catch(e){}if(!(sv&&load(sv)))add('Cube');undoS=[]}resize();
(function loop(){requestAnimationFrame(loop);orbit.update();R.render(scene,cam)})();
</script></body></html>
